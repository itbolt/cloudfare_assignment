<!DOCTYPE html>
<html>
<head>
    <title>UCSB Course Helper</title>
</head>
<body>
    <h1>UCSB Course Helper</h1>

    <div id="messages" style="white-space: pre-wrap; border:1px solid #ccc; padding:10px; width:90%; height:400px; overflow-y:auto;"></div>

    <br>

    <input id="input" placeholder="Ask something..." style="width:300px;">
    <button onclick="send()">Send</button>

    <script>
        const messages = document.getElementById("messages");

        function addMessage(text) {
            messages.textContent += text + "\n";
        }

        async function send() {
            const text = document.getElementById("input").value;
            addMessage("You: " + text);
            document.getElementById("input").value = "";

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!res.ok) {
                    addMessage("⚠️ Server error: " + res.status);
                    return;
                }

                const data = await res.text();
                addMessage("Bot: " + data);

            } catch (err) {
                addMessage("❌ Network error");
            }
        }
    </script>
</body>
</html>
