<!DOCTYPE html>
<html>
<head>
    <title>UCSB Course Helper</title>
    <style>
        #chat {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h1>UCSB Course Helper</h1>

<div id="chat"></div>

<br>

<input id="msg" type="text" placeholder="Ask something..." style="width:300px;">
<button onclick="sendMessage()">Send</button>

<script>
const WORKER_URL = "https://ucsb-course-helper.MINHTIEN-NGUYEN345.workers.dev/chat";  
// ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
// REPLACE with your real workers.dev URL
// DO NOT use /chat on your Pages site — that will always 405.

async function sendMessage() {
    const input = document.getElementById("msg");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    chat.innerHTML += "You: " + message + "\n";
    input.value = "";

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });

        if (!res.ok) {
            chat.innerHTML += "⚠ Server error: " + res.status + "\n";
            return;
        }

        const data = await res.json();
        chat.innerHTML += "Bot: " + data.reply + "\n";

    } catch (err) {
        chat.innerHTML += "⚠ Network error\n";
    }
}
</script>

</body>
</html>
