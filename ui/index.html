<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UCSB Course Helper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #chatBox {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 15px;
            background: #fafafa;
        }

        #inputBox {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }

        #sendBtn {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>UCSB Course Helper</h1>

<div id="chatBox"></div>

<input id="inputBox" placeholder="Ask something..." />
<button id="sendBtn">Send</button>

<script src="chat.js"></script>

</body>
</html>
